# OPTIONAL per-edition overrides. The site discovers its editions from the
# GCS bucket: each edition's latest.json carries visibility/pinned publish
# metadata, authored in the songbook-generator repo
# (generator/config/songbooks/<edition>.yaml) — that is the normal place to
# publish, feature or retire an edition.
#
# Use this file only for emergencies (pulling a book off the site, or forcing
# one on, without waiting for a songbook-generator publish) and for editions
# that have no generator config at all.
# Precedence: this file > latest.json > defaults (a latest.json that predates
# the visibility field is treated as unlisted).
#
# Example:
#   overrides:
#     some-edition:
#       visibility: unlisted   # 'public' or 'unlisted'
#       pinned: true           # optional
#
overrides:
  # april-fools-2026 is not managed by the generator (no edition config, and
  # regenerating it would overwrite the joke PDF), so its stale latest.json
  # defaults to unlisted; list it explicitly here.
  april-fools-2026:
    visibility: public
  current:
    visibility: unlisted
  complete:
    visibility: unlisted
