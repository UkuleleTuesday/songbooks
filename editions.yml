# OPTIONAL per-edition overrides. The site discovers its editions from the
# GCS bucket: each edition's latest.json carries visibility/pinned publish
# metadata, authored in the songbook-generator repo
# (generator/config/songbooks/<edition>.yaml) — that is the normal place to
# publish, feature or retire an edition.
#
# Use this file ONLY for emergencies: pulling a book off the site (or forcing
# one on) without waiting for a songbook-generator publish.
# Precedence: this file > latest.json > defaults (a latest.json that predates
# the visibility field is treated as unlisted).
#
# Example:
#   overrides:
#     some-edition:
#       visibility: unlisted   # 'public' or 'unlisted'
#       pinned: true           # optional
#
# TEMPORARY: the entries below mirror the generator-side publish metadata
# reconciliation (https://github.com/UkuleleTuesday/songbook-generator/pull/455)
# so this site behaves correctly whichever lands first. Delete them once that
# PR is merged and its sync workflow has updated the bucket's latest.json files.
overrides:
  monopolele-2026:
    visibility: unlisted
  travel-songbook:
    visibility: unlisted
  wexford-2026:
    visibility: unlisted
  pride-candidates:
    visibility: unlisted
  current:
    pinned: true
  complete:
    pinned: true
